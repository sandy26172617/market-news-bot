name: Market News Bot

on:
  schedule:
    # IST = UTC + 5:30
    # 7:00 AM IST = 1:30 AM UTC
    # 5:00 PM IST = 11:30 AM UTC

    # Every 15 minutes from 7:00 AM to 5:00 PM IST (1:30 AM to 11:30 AM UTC)
    - cron: '*/15 1-11 * * *'

    # Every hour from 5:00 PM to 7:00 AM IST (11:30 AM to 1:30 AM UTC)
    - cron: '0 12-23 * * *'
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests pytz

      - name: Run market bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_bot.py
